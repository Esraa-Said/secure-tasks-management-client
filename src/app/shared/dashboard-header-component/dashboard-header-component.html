<div class="container">
  <div class="logo-title">
    <div class="logo">
      <img src="assets/dashboard.png" alt="todo" />
    </div>
    <div class="title">
      <h3>TaskTastic</h3>
      <p>Task Management</p>
    </div>
  </div>

  <div class="search">
    <img src="assets/search.png" alt="search" />
    <input type="text" placeholder="Search tasks...." />
  </div>

  <div class="new-task">
    <a routerLink="/">
      <span style="font-size: 20px;">+</span>

      <span>New Task</span>
    </a>
  </div>

  <div class="user">
    <h5>

      {{ authService.user()?.name }}
    </h5>
    
    <p> {{ authService.user()?.email }}</p>
  </div>
</div>
