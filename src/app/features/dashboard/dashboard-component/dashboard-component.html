<div class="container">
  <header>
    <div>
      <h1>Welcome back, {{ authService.user()?.name }}! 👋</h1>
      <p>Here's what's happening with your projects today.</p>
    </div>
    <p>Today: {{ todayDate() | date }}</p>
  </header>

  <app-dashboard-numbers
    [numberOfArchivedTasks]="numberOfArchivedTasks"
    [numberOfCompletedTasks]="numberOfCompletedTasks"
    [numberOfProgressTasks]="numberOfProgressTasks"
    [numberOfTasks]="numberOfTasks"
  ></app-dashboard-numbers>

  <main>
    <app-dashboard-in-progress-tasks-component> </app-dashboard-in-progress-tasks-component>

    <app-high-priority-tasks-dashboard-component></app-high-priority-tasks-dashboard-component>
  </main>

  @if (errorMessage) {
    <div class="error-message">*{{ errorMessage }}</div>
  }
</div>
