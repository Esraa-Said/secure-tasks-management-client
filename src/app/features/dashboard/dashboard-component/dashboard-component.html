<div class="container">
  <div class="header">
    <div>
      <h1>Welcome back, Sarah! 👋</h1>
      <p>Here's what's happening with your projects today.</p>
    </div>
    <p>Today: {{ todayDate() }}</p>
  </div>

  <div class="numbers-boxes">


    <div class="box">
      <div class="image">
        <img src="assets/tasks.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfTasks() }}
      </div>
      <div class="title">Total Tasks</div>
    </div>


      <div class="box">
      <div class="image">
        <img src="assets/checkmark-icon.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfCompletedTasks() }}
      </div>
      <div class="title">Completed Tasks</div>
    </div>

      <div class="box">
      <div class="image">
        <img src="assets/archived_tasks.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfArchivedTasks() }}
      </div>
      <div class="title">Completed Tasks</div>
    </div>


  </div>
</div>
