  <div class="numbers-boxes">
    <div class="box">
      <div class="image" style="background-color: rgb(255, 106, 0);">
        <img src="assets/work-in-progress-white.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfProgressTasks() }}
      </div>
      <div class="title">In Progress Tasks</div>
    </div>

    <div class="box">
      <div class="image" style="background-color: rgb(63, 94, 247);">
        <img src="assets/tasks.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfTasks() }}
      </div>
      <div class="title">Total Tasks</div>
    </div>

    <div class="box">
      <div class="image" style="background-color: rgb(3, 174, 103);">
        <img src="assets/checkmark-icon.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfCompletedTasks() }}
      </div>
      <div class="title">Completed Tasks</div>
    </div>

    <div class="box">
      <div class="image" style="background-color: rgb(237, 102, 102);">
        <img src="assets/archived_tasks.png" alt="icon" />
      </div>
      <div class="number">
        {{ numberOfArchivedTasks() }}
      </div>
      <div class="title">Archived Tasks</div>
    </div>
  </div>
