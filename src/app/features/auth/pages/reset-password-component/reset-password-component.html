<div class="container">

    <div class="lock-img">
      <img src="assets/lock.png" alt="lock" />
    </div>

    <h1>Reset Your Password</h1>

    <p style="color: var(--gray-700); text-align: center;">Enter a new password for your account</p>

    <form>
      <div class="password">
        <p for="password">New Password</p>

        <div class="input-box">
          <img src="assets/lock-password.png" alt="lock-password" />
          <input type="password" placeholder="Enter your new password" />
          <img src="assets/view.png" alt="view" />
        </div>
      </div>

      <div class="password">
        <p for="confirm-password">Confirm New Password</p>

        <div class="input-box">
          <img src="assets/lock-password.png" alt="lock-password" />
          <input type="password" placeholder="Re-enter your new password" />
          <img src="assets/view.png" alt="view" />
        </div>
      </div>

      <div class="roles-parent">
        <h5>Your password must contain:</h5>

        <div class="roles">
          <div class="role">
            <p class="circle"></p>
            <div class="text">
              <p>Minimum 6 characters</p>
              <p>{{ passwordCount }}/6 characters</p>
            </div>
          </div>

          <div class="role">
            <p class="circle"></p>
            <div class="text">
              <p>Upper & lowercase letters</p>
              <p>Mix of A-Z and a-z</p>
            </div>
          </div>

          <div class="role">
            <p class="circle"></p>
            <div class="text">
              <p>At least one number</p>
              <p>include 0-9</p>
            </div>
          </div>

          <div class="role">
            <p class="circle"></p>
            <div class="text">
              <p>Special character</p>
              <p>!@#$%^&* etc.</p>
            </div>
          </div>
        </div>
      </div>

      <button >Update Password</button>
    </form>
  </div>
